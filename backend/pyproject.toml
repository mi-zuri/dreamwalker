[project]
name = "dreamwalker-backend"
version = "0.1.0"
description = "Dreamwalker generation pipeline and game API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "google-genai>=1.38",
    "google-cloud-firestore>=2.21",
    "google-cloud-storage>=2.19",
    "firebase-admin>=6.6",
    "feedparser>=6.0",
    "sse-starlette>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
