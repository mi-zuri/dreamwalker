# Built by Cloud Build rather than locally: Cloud Run wants linux/amd64 and
# the workstation is arm64, so a local `docker build` would either need
# emulation or silently ship an image that will not start.
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --file=infra/Dockerfile
      - --tag=${_IMAGE}
      # The same image also becomes the cache tag. Moving `latest` afterwards
      # with `gcloud artifacts docker tags add` needs `artifactregistry.tags.
      # delete`, which `roles/artifactregistry.writer` does not carry - so the
      # tag is pushed here instead, where it is an ordinary upload.
      - --tag=${_CACHE}
      # Previous image as a layer cache: dependencies almost never change,
      # and pulling them beats reinstalling them.
      - --cache-from=${_CACHE}
      - .

images:
  - ${_IMAGE}
  # `latest` is only ever a cache hint; deployments always name a digest-stable
  # tag so a rollback is a redeploy of a known image.
  - ${_CACHE}

substitutions:
  _IMAGE: ""
  _CACHE: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
